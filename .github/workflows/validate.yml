name: Validate evidence ledger
on:
  push:
    paths:
      - 'data/**'
      - 'assets/atlas-data.js'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'assets/atlas-data.js'
      - 'tools/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source references
        run: python tools/validate.py
      - name: Check generated browser data
        run: |
          python tools/build.py
          git diff --exit-code -- assets/atlas-data.js
